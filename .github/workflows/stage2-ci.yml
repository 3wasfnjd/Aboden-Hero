name: Stage 2 CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/stage2.js
          node --check src/stage2-rooftop.js
          node --check src/stage2-state.js
          node --check src/gesture-lock.js
          node --check src/stage2-tower.js
          node --check puzzle-kit/wiring/demo.js
          node --check puzzle-kit/wiring/wiring.js
          node --check puzzle-kit/wiring/wiring-logic.js
          node --check puzzle-kit/wiring/assets.js
          node --check puzzle-kit/core/puzzle-audio.js
          node --check puzzle-kit/matching/demo.js
          node --check puzzle-kit/matching/matching.js
          node --check puzzle-kit/matching/matching-logic.js
          node --check puzzle-kit/matching/assets.js
          node --check puzzle-kit/cubes/demo.js
          node --check puzzle-kit/cubes/cubes.js
          node --check puzzle-kit/cubes/cubes-logic.js
          node --check puzzle-kit/cubes/assets.js
      - name: Verify game assets
        run: |
          test -s assets/stage2/tower-background-with-puzzles.png
          test -s assets/stage2/rooftop/E254AA9A-004F-4581-B58B-1FF6F0427114.jpeg
          test -s assets/stage2/rooftop/B78F8298-AC6E-4984-8171-6060AD95C1AD.png
          test -s assets/stage2/rooftop/0D1BD2D4-2C58-41AD-87C6-AF3454DDCD3D.png
          test -s assets/stage2/rooftop/68F8B92C-855E-4303-B55B-4E69B4BDDDE7.png
          test -s assets/stage2/rooftop/C73795B9-E427-4AA3-A3DC-B3C990A6B7F4.png
          test -s assets/stage2/rooftop/4660C9C3-D5D8-4F99-AAD3-8EC865E593D2.png
          test -s assets/stage2/rooftop/152AB8BD-FD1C-44F8-BCBD-D043437BC255.png
          test -s assets/stage2/rooftop/CE321790-436E-4BF6-BF00-23D8E11F8635.png
          test -s assets/stage2/rooftop/712D453B-A752-4A91-BB87-AE9554BBF4FA.png
          test -s stage2.html
          test -s puzzle-kit/wiring/assets/original/board.png
          test -s puzzle-kit/wiring/assets/original/pipe-straight.png
          test -s puzzle-kit/wiring/assets/original/pipe-elbow.png
          test -s puzzle-kit/wiring/assets/original/pipe-cross.png
          test -s puzzle-kit/wiring/assets/original/pipe-tee.png
          test -s puzzle-kit/matching/assets/original/board.png
          test -s puzzle-kit/matching/assets/original/cable-blue.png
          test -s puzzle-kit/matching/assets/original/cable-orange.png
          test -s puzzle-kit/matching/assets/original/cable-purple.png
          test -s puzzle-kit/cubes/assets/original/board.png
          test -s puzzle-kit/cubes/assets/original/solution.png
          test -s puzzle-kit/cubes/assets/original/start.png
          test -s puzzle-kit/cubes/assets/original/right.png
          test -s puzzle-kit/cubes/assets/original/down.png
          test -s puzzle-kit/cubes/assets/original/straight.png
          test -s puzzle-kit/cubes/assets/original/junction.png
          test -s puzzle-kit/cubes/assets/original/lock.png
          test -s puzzle-kit/cubes/assets/original/goal.png
