name: Stage 2 CI

on:
  push:
    branches:
      - feature/stage2-rooftop-elevator-20260919
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: npm test
      - name: Check chapter 2 syntax
        run: |
          node --check src/stage2.js
          node --check src/stage2-state.js
      - name: Verify chapter 2 assets
        run: |
          test -s assets/stage2/floors-atlas.webp
          test -s assets/stage2/elevator.webp
          test -s stage2.html
