<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wiring Puzzle • ABODEN Puzzle Kit</title>
<link rel="stylesheet" href="../core/puzzle-host.css">\n<link rel="stylesheet" href="./wiring.css">
</head>
<body>
<main class="puzzle-demo">
  <header class="puzzle-demo-header"><div><h1>Wiring Puzzle</h1><small>Standalone Puzzle Module</small></div><a href="../" style="color:#8ddcff">Puzzle Kit</a></header>
  <section id="puzzle-root" class="puzzle-root" aria-label="Wiring Puzzle"></section>
</main>
<script type="module">
import {createWiringPuzzle} from './wiring.js';
const root=document.getElementById('puzzle-root');
const puzzle=await createWiringPuzzle({root});\npuzzle.onSolved(()=>{ document.title='✓ Wiring Solved • ABODEN Puzzle Kit'; });
window.puzzle=puzzle;
puzzle.start();
</script>
</body>
</html>
